name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adp
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adp -d adp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/adp
      SPRING_DATASOURCE_USERNAME: adp
      SPRING_DATASOURCE_PASSWORD: adp
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '2'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
      ADP_MOCK_RUNTIME_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen DA Digital Asset fixtures
        uses: actions/checkout@v4
        with:
          repository: ADP-24-7/ADP-DA
          ref: c586b44c4913454f8359f4a0cc53f2a2ccddeaff
          path: contract-sources/ADP-DA
          sparse-checkout: 03_digital_asset/artifacts/local_product_e2e_v1

      - name: Validate Docker Compose
        run: |
          mkdir -p ../ADP-FE ../ADP-DA ../ADP-Docs
          touch ../ADP-DA/Dockerfile
          docker compose --profile test config

      - name: Validate AI Evaluation E2E harness
        run: |
          sh -n scripts/run-ai-evaluation-e2e.sh
          sh -n scripts/run-ncp-artifact-ingest-e2e.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/ops/prometheus:/etc/prometheus/rules:ro"
          prom/prometheus:v3.5.0
          check rules /etc/prometheus/rules/alerts.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        env:
          ADP_DA_ROOT: ${{ github.workspace }}/contract-sources/ADP-DA
        run: gradle --no-daemon test

      - name: Package
        run: gradle --no-daemon bootJar
