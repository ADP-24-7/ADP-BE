services:
  adp-be:
    build:
      context: .
    container_name: adp-be
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks:
      - adp-local

networks:
  adp-local:
    external: true
