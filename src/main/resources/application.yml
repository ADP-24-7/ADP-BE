spring:
  application:
    name: adp-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adp}
    username: ${SPRING_DATASOURCE_USERNAME:adp}
    password: ${SPRING_DATASOURCE_PASSWORD:adp}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

adp:
  local-user-auth:
    enabled: ${ADP_LOCAL_USER_AUTH_ENABLED:false}
  local-fixtures:
    enabled: ${ADP_LOCAL_FIXTURES_ENABLED:false}
  mock-runtime:
    enabled: ${ADP_MOCK_RUNTIME_ENABLED:false}
  data-access-preview:
    enabled: ${ADP_DATA_ACCESS_PREVIEW_ENABLED:false}
  context-preview:
    enabled: ${ADP_CONTEXT_PREVIEW_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
      show-details: never
