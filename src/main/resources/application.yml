spring:
  application:
    name: adp-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adp}
    username: ${SPRING_DATASOURCE_USERNAME:adp}
    password: ${SPRING_DATASOURCE_PASSWORD:adp}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
