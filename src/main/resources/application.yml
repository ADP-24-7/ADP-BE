spring:
  application:
    name: adp-be
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adp}
    username: ${SPRING_DATASOURCE_USERNAME:adp}
    password: ${SPRING_DATASOURCE_PASSWORD:adp}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

adp:
  audit-export:
    retention: ${ADP_AUDIT_EXPORT_RETENTION:1h}
    lease-duration: ${ADP_AUDIT_EXPORT_LEASE_DURATION:30s}
    max-file-size: ${ADP_AUDIT_EXPORT_MAX_FILE_SIZE:2MB}
    scheduler:
      enabled: ${ADP_AUDIT_EXPORT_SCHEDULER_ENABLED:false}
      fixed-delay: ${ADP_AUDIT_EXPORT_SCHEDULER_FIXED_DELAY:2s}
  recovery:
    lease-duration: ${ADP_RECOVERY_LEASE_DURATION:30s}
    initial-backoff: ${ADP_RECOVERY_INITIAL_BACKOFF:1m}
    max-backoff: ${ADP_RECOVERY_MAX_BACKOFF:15m}
    scheduler:
      enabled: ${ADP_RECOVERY_SCHEDULER_ENABLED:false}
      fixed-delay: ${ADP_RECOVERY_SCHEDULER_FIXED_DELAY:30s}
      batch-size: ${ADP_RECOVERY_SCHEDULER_BATCH_SIZE:20}
  security:
    trace:
      accept-caller-trace-id: ${ADP_ACCEPT_CALLER_TRACE_ID:false}
    request-freshness:
      enabled: ${ADP_REQUEST_FRESHNESS_ENABLED:true}
      replay-window: ${ADP_REQUEST_REPLAY_WINDOW:5m}
      future-skew: ${ADP_REQUEST_FUTURE_SKEW:30s}
    egress:
      allow-private-destinations: ${ADP_EGRESS_ALLOW_PRIVATE_DESTINATIONS:false}
      allowed-hosts: ${ADP_EGRESS_ALLOWED_HOSTS:integrate.api.nvidia.com}
  digital-asset:
    artifact-store:
      type: ${ADP_DIGITAL_ASSET_ARTIFACT_STORE_TYPE:disabled}
      local-root: ${ADP_DIGITAL_ASSET_ARTIFACT_STORE_LOCAL_ROOT:.}
      ncp:
        endpoint: ${ADP_NCP_OBJECT_STORAGE_ENDPOINT:https://kr.object.ncloudstorage.com}
        region: ${NCLOUD_REGION:KR}
        bucket: ${ADP_NCP_ARTIFACT_BUCKET:adp-qa-data-artifacts}
        access-key: ${NCLOUD_ACCESS_KEY:}
        secret-key: ${NCLOUD_SECRET_KEY:}
        connect-timeout: ${ADP_NCP_OBJECT_STORAGE_CONNECT_TIMEOUT:5s}
        read-timeout: ${ADP_NCP_OBJECT_STORAGE_READ_TIMEOUT:30s}
  observability:
    prometheus-public: ${ADP_PROMETHEUS_PUBLIC:false}
    operational-metrics-cache: ${ADP_OPERATIONAL_METRICS_CACHE:5s}
    stale-operation-threshold: ${ADP_STALE_OPERATION_THRESHOLD:5m}
  idempotency:
    retention: ${ADP_IDEMPOTENCY_RETENTION:72h}
  local-user-auth:
    enabled: ${ADP_LOCAL_USER_AUTH_ENABLED:false}
  local-fixtures:
    enabled: ${ADP_LOCAL_FIXTURES_ENABLED:false}
  mock-runtime:
    enabled: ${ADP_MOCK_RUNTIME_ENABLED:false}
  ai-connector:
    enabled: ${ADP_AI_CONNECTOR_ENABLED:false}
    base-url: ${ADP_AI_CONNECTOR_BASE_URL:http://localhost:8090}
    nvidia-base-url: ${ADP_NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
    api-key: ${NVIDIA_API_KEY:}
    connect-timeout: ${ADP_AI_CONNECTOR_CONNECT_TIMEOUT:2s}
    read-timeout: ${ADP_AI_CONNECTOR_READ_TIMEOUT:5s}
  data-access-preview:
    enabled: ${ADP_DATA_ACCESS_PREVIEW_ENABLED:false}
  context-preview:
    enabled: ${ADP_CONTEXT_PREVIEW_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${ADP_ADMIN_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${ADP_ADMIN_SESSION_COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: unrestricted
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
      show-details: never

logging:
  structured:
    format:
      console: logstash
